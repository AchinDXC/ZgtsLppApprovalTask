_schema-version: "3.2"
ID: ZgtsLppApprovalTask
version: 0.0.1
modules:
- name: ZgtsLppApprovalTask-destination-content
  type: com.sap.application.content
  requires:
  - name: ZgtsLppApprovalTask-destination-service
    parameters:
      content-target: true
  - name: ZgtsLppApprovalTask_html_repo_host
    parameters:
      service-key:
        name: ZgtsLppApprovalTask_html_repo_host-key
  - name: uaa_ZgtsLppApprovalTask
    parameters:
      service-key:
        name: uaa_ZgtsLppApprovalTask-key
  parameters:
    content:
      subaccount:
        destinations:
        - Name: zgtslppapproval_ZgtsLppApprovalTask_html_repo_host
          ServiceInstanceName: ZgtsLppApprovalTask-html5-app-host-service
          ServiceKeyName: ZgtsLppApprovalTask_html_repo_host-key
          sap.cloud.service: zgtslppapproval
        - Authentication: OAuth2UserTokenExchange
          Name: zgtslppapproval_uaa_ZgtsLppApprovalTask
          ServiceInstanceName: ZgtsLppApprovalTask-xsuaa-service
          ServiceKeyName: uaa_ZgtsLppApprovalTask-key
          sap.cloud.service: zgtslppapproval
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: ZgtsLppApprovalTask-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: ZgtsLppApprovalTask_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comhpegtsworkflowuimodule.zip
      name: comhpegtsworkflowuimodule
      target-path: resources/
- name: comhpegtsworkflowuimodule
  type: html5
  path: workflow-ui-module
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: ZgtsLppApprovalTask-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: ZgtsLppApprovalTask-destination-service
    service-plan: lite
- name: ZgtsLppApprovalTask_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: ZgtsLppApprovalTask-html5-app-host-service
    service-plan: app-host
- name: uaa_ZgtsLppApprovalTask
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: ZgtsLppApprovalTask-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
